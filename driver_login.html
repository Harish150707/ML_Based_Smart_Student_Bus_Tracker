<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver Login · Smart Student Tracking System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="auth-page">

{% import "_macros.html" as ui %}

<div class="auth-card">

  <div class="auth-icon">{{ ui.logo(34, 'teal') }}</div>

  <h1>Driver Login</h1>
  <p class="subtitle">Access your route and share live GPS</p>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="alert alert-danger text-center py-2">{{ messages[0] }}</div>
    {% endif %}
  {% endwith %}

  <form method="POST">

    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-control" required>
    </div>

    <div class="mb-4">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" required>
    </div>

    <button
      class="btn w-100"
      style="background:var(--teal-500); color:#fff; height:50px; border-radius:10px;">
      <i class="fas fa-right-to-bracket"></i> Login
    </button>

  </form>

  <div class="text-center mt-3">
    <a href="/login" class="small text-muted text-decoration-none">Admin Login</a>
  </div>

</div>

</body>
</html>
