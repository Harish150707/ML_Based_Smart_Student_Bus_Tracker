{% extends "base.html" %}

{% block title %}Edit Driver · Smart Student Tracking System{% endblock %}
{% block page_title %}Edit Driver{% endblock %}

{% block content %}
<div class="panel" style="max-width:800px; margin:0 auto;">

  <h4 class="mb-4"><i class="fas fa-id-badge" style="color:var(--teal-500);"></i> Edit Driver</h4>

  <form method="POST">

    <div class="row">

      <div class="col-md-6 mb-3">
        <label class="form-label">Driver Name <span class="text-danger">*</span></label>
        <input type="text" name="driver_name" class="form-control" value="{{ driver.driver_name }}" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Phone <span class="text-danger">*</span></label>
        <input type="text" name="phone" class="form-control" value="{{ driver.phone }}" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Login Username <span class="text-danger">*</span></label>
        <input type="text" name="username" class="form-control" value="{{ driver.username }}" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">New Password</label>
        <input type="password" name="password" class="form-control" placeholder="Leave blank to keep current password">
      </div>

      <div class="col-md-12 mb-3">
        <label class="form-label">Assign Bus</label>
        <select name="bus_id" class="form-select">
          <option value="">-- Not Assigned --</option>
          {% for bus in buses %}
          <option value="{{ bus.bus_id }}" {{ 'selected' if driver.bus_id == bus.bus_id else '' }}>
            {{ bus.bus_no }} — {{ bus.route_name }}
          </option>
          {% endfor %}
        </select>
      </div>

    </div>

    <hr>

    <div class="d-grid gap-2">
      <button type="submit" class="btn btn-lg" style="background:var(--teal-500); color:#fff;">
        <i class="fa fa-save"></i> Update Driver
      </button>
      <a href="/view_drivers" class="btn btn-outline-dark">
        <i class="fas fa-id-badge"></i> View Drivers
      </a>
    </div>

  </form>

</div>
{% endblock %}
