{% extends "base.html" %}

{% block title %}Assign Bus · Smart Student Tracking System{% endblock %}
{% block page_title %}Assign Bus{% endblock %}

{% block content %}
<div class="panel" style="max-width:560px; margin:0 auto;">

  <h4 class="mb-1"><i class="fas fa-bus" style="color:var(--teal-500);"></i> Assign Bus to Student</h4>
  <p class="text-muted mb-4">
    {{ student.student_name }} &middot; <span class="mono">{{ student.roll_no }}</span>
  </p>

  <form method="POST">

    <div class="mb-4">
      <label class="form-label">Select Bus</label>
      <select name="bus_id" class="form-select" required>
        {% for bus in buses %}
        <option value="{{ bus.bus_id }}">{{ bus.bus_no }} — {{ bus.route_name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="d-grid gap-2">
      <button type="submit" class="btn btn-lg" style="background:var(--teal-500); color:#fff;">
        <i class="fas fa-check"></i> Assign Bus
      </button>
      <a href="/view_students" class="btn btn-outline-dark">
        <i class="fas fa-arrow-left"></i> Back to Students
      </a>
    </div>

  </form>

</div>
{% endblock %}
