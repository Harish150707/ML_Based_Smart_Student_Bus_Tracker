<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · Smart Student Tracking System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="auth-page">

{% import "_macros.html" as ui %}

<div class="auth-card">

  <div class="auth-icon">{{ ui.logo(34, 'teal') }}</div>

  <h1>Smart Student Tracking</h1>
  <p class="subtitle">Sign in to continue</p>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="alert alert-danger text-center py-2">{{ messages[0] }}</div>
    {% endif %}
  {% endwith %}

  <form action="/login" method="POST">

    <div class="mb-3">
      <label class="form-label"><i class="fas fa-user"></i> Username</label>
      <input
        type="text"
        class="form-control"
        name="username"
        placeholder="Enter Username"
        required>
    </div>

    <div class="mb-4">
      <label class="form-label"><i class="fas fa-lock"></i> Password</label>
      <input
        type="password"
        class="form-control"
        name="password"
        placeholder="Enter Password"
        required>
    </div>

    <button
      class="btn w-100"
      style="background:var(--teal-500); color:#fff; height:50px; font-size:1.05rem; border-radius:10px;"
      type="submit">
      <i class="fas fa-right-to-bracket"></i> Login
    </button>

  </form>

  <div class="text-center mt-3">
    <a href="/driver_login" class="small text-muted text-decoration-none me-3">Driver Login</a>
    <a href="/parent_login" class="small text-muted text-decoration-none">Parent Login</a>
  </div>

  <div class="text-center mt-4 text-muted" style="font-size:.8rem;">
    © 2026 Smart Student Tracking System
  </div>

</div>

</body>
</html>
