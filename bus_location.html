<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Live Location · Smart Student Tracking System</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
  body{
    font-family:'Inter', sans-serif;
    margin:0;
    padding:24px;
    background:#F5F7FA;
  }
  h2{
    font-family:'Space Grotesk', sans-serif;
    color:#0E1526;
    margin-bottom:16px;
  }
  #map{
    height:520px;
    width:100%;
    border-radius:16px;
    box-shadow:0 8px 24px rgba(14,21,38,.08);
  }
</style>
</head>

<body>

<h2><i class="fas fa-map-marker-alt" style="color:#14B8A6;"></i> Live Bus Location</h2>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
var lat = {{ latitude }};
var lng = {{ longitude }};

var map = L.map('map').setView([lat, lng], 15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

L.marker([lat, lng]).addTo(map)
    .bindPopup("Bus Location")
    .openPopup();
</script>

</body>
</html>
