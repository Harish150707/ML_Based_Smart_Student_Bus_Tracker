{% extends "base.html" %}

{% block title %}Edit Student · Smart Student Tracking System{% endblock %}
{% block page_title %}Edit Student{% endblock %}

{% block content %}
<div class="panel" style="max-width:800px; margin:0 auto;">

  <h4 class="mb-4"><i class="fa fa-user-edit" style="color:var(--teal-500);"></i> Edit Student</h4>

  <form action="/update_student/{{ student.student_id }}" method="POST">

    <div class="row">

      <div class="col-md-6 mb-3">
        <label class="form-label">Student Name <span class="text-danger">*</span></label>
        <input type="text" name="student_name" class="form-control" value="{{ student.student_name }}" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Roll Number <span class="text-danger">*</span></label>
        <input type="text" name="roll_no" class="form-control" value="{{ student.roll_no }}" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Department <span class="text-danger">*</span></label>
        <input type="text" name="department" class="form-control" value="{{ student.department }}" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Year <span class="text-danger">*</span></label>
        <input type="number" name="year" class="form-control" value="{{ student.year }}" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Bus Number</label>
        <input type="text" name="bus_no" class="form-control" value="{{ student.bus_no }}">
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Date of Birth</label>
        <input type="date" name="date_of_birth" class="form-control" value="{{ student.date_of_birth }}" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Parent Name <span class="text-danger">*</span></label>
        <input type="text" name="parent_name" class="form-control" value="{{ student.parent_name }}" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Parent Email <span class="text-danger">*</span></label>
        <input type="email" name="parent_email" class="form-control" value="{{ student.parent_email }}" required>
      </div>

      <div class="col-md-12 mb-3">
        <label class="form-label">Parent Phone <span class="text-danger">*</span></label>
        <input type="text" name="parent_phone" class="form-control" value="{{ student.parent_phone }}" required>
      </div>

    </div>

    <hr>

    <div class="d-grid gap-2">
      <button type="submit" class="btn btn-lg" style="background:var(--teal-500); color:#fff;">
        <i class="fa fa-save"></i> Update Student
      </button>
      <a href="/view_students" class="btn btn-outline-dark">
        <i class="fa fa-users"></i> View Students
      </a>
    </div>

  </form>

</div>
{% endblock %}
