{% extends "base.html" %}

{% block title %}Edit Bus · Smart Student Tracking System{% endblock %}
{% block page_title %}Edit Bus{% endblock %}

{% block content %}
<div class="panel" style="max-width:800px; margin:0 auto;">

  <h4 class="mb-4"><i class="fa fa-bus" style="color:var(--teal-500);"></i> Edit Bus Details</h4>

  <form method="POST">

    <div class="row">

      <div class="col-md-6 mb-3">
        <label class="form-label">Bus Number <span class="text-danger">*</span></label>
        <input type="text" name="bus_no" class="form-control" value="{{ bus.bus_no }}" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Driver Name <span class="text-danger">*</span></label>
        <input type="text" name="driver_name" class="form-control" value="{{ bus.driver_name }}" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Driver Phone <span class="text-danger">*</span></label>
        <input type="text" name="driver_phone" class="form-control" value="{{ bus.driver_phone }}" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Route Name <span class="text-danger">*</span></label>
        <input type="text" name="route_name" class="form-control" value="{{ bus.route_name }}" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Capacity <span class="text-danger">*</span></label>
        <input type="number" name="capacity" class="form-control" value="{{ bus.capacity }}" required>
      </div>

    </div>

    <hr>

    <div class="d-grid gap-2">
      <button type="submit" class="btn btn-lg" style="background:var(--teal-500); color:#fff;">
        <i class="fa fa-save"></i> Update Bus
      </button>
      <a href="/view_buses" class="btn btn-outline-dark">
        <i class="fa fa-road"></i> View Bus List
      </a>
    </div>

  </form>

</div>
{% endblock %}
