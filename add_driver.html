{% extends "base.html" %}

{% block title %}Add Driver · Smart Student Tracking System{% endblock %}
{% block page_title %}Add Driver{% endblock %}

{% block content %}
<div class="panel" style="max-width:800px; margin:0 auto;">

  <h4 class="mb-4"><i class="fas fa-id-badge" style="color:var(--teal-500);"></i> Add New Driver</h4>

  <form action="/add_driver" method="POST">

    <div class="row">

      <div class="col-md-6 mb-3">
        <label class="form-label">Driver Name <span class="text-danger">*</span></label>
        <input type="text" name="driver_name" class="form-control" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Phone <span class="text-danger">*</span></label>
        <input type="text" name="phone" class="form-control" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Login Username <span class="text-danger">*</span></label>
        <input type="text" name="username" class="form-control" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Login Password <span class="text-danger">*</span></label>
        <input type="password" name="password" class="form-control" required>
      </div>

      <div class="col-md-12 mb-3">
        <label class="form-label">Assign Bus</label>
        <select name="bus_id" class="form-select">
          <option value="">-- Not Assigned --</option>
          {% for bus in buses %}
          <option value="{{ bus.bus_id }}">{{ bus.bus_no }} — {{ bus.route_name }}</option>
          {% endfor %}
        </select>
      </div>

    </div>

    <hr>

    <div class="d-grid gap-2">
      <button type="submit" class="btn btn-lg" style="background:var(--teal-500); color:#fff;">
        <i class="fa fa-save"></i> Add Driver
      </button>
      <a href="/view_drivers" class="btn btn-outline-dark">
        <i class="fas fa-id-badge"></i> View All Drivers
      </a>
    </div>

  </form>

</div>
{% endblock %}
